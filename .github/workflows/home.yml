name: Build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: home-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Nix with Flakes support
        uses: cachix/install-nix-action@v31.3.0
      - name: Evaluate all flake outputs
        run: nix flake check --all-systems --no-build -L
      - name: Check Pi package pins
        run: nix run .#update-pi -- --check

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            configuration: siraben@x86_64-linux-minimal
          - os: ubuntu-24.04
            configuration: siraben@x86_64-linux-headless
          - os: ubuntu-24.04
            configuration: siraben@x86_64-linux-full
          - os: ubuntu-24.04-arm
            configuration: siraben@aarch64-linux-minimal
          - os: ubuntu-24.04-arm
            configuration: siraben@aarch64-linux-headless
          - os: macos-15
            configuration: siraben@aarch64-darwin-full
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Nix with Flakes support
        uses: cachix/install-nix-action@v31.3.0

      - name: Configure Cachix for pull requests
        if: github.event_name == 'pull_request'
        uses: cachix/cachix-action@v16
        with:
          name: siraben

      - name: Configure Cachix for trusted pushes
        if: github.event_name == 'push'
        uses: cachix/cachix-action@v16
        with:
          name: siraben
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Home Manager configuration
        run: nix build '.#homeConfigurations."${{ matrix.configuration }}".activationPackage' -L
