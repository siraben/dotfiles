name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31.3.0
      - name: Check workflows, shell scripts, and changed Nix formatting
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          nix shell --inputs-from . nixpkgs#nixfmt nixpkgs#actionlint
          nixpkgs#shellcheck --command bash scripts/check-quality.sh "$BASE_REVISION"
      - name: Run existing Pi usage regression tests
        run: >-
          nix shell --inputs-from . nixpkgs#nodejs_24 --command node
          --experimental-vm-modules --test
          home-manager/.config/nixpkgs/test-pi-codex-usage.mjs

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Nix with Flakes support
        uses: cachix/install-nix-action@v31.3.0

      - name: Configure Cachix
        uses: cachix/cachix-action@v16
        with:
          name: siraben
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Evaluate every exported configuration
        run: |
          nix eval --json .# --apply 'flake: {
            home = builtins.mapAttrs (_: value: value.activationPackage.drvPath) (flake.homeConfigurations or {});
            nixos = builtins.mapAttrs (_: value: value.config.system.build.toplevel.drvPath) (flake.nixosConfigurations or {});
          }'
          nix flake check --all-systems --no-build

      - name: Build native flake checks
        run: nix flake check -L

      - name: Build home-manager flake configuration
        run: |
          set -euo pipefail
          echo "OS: ${{ matrix.os }}"
          if [[ "${{ matrix.os }}" == "ubuntu-24.04" ]]; then
            echo "Building for Linux (siraben@x86_64-linux-headless)"
            nix build .#homeConfigurations."siraben@x86_64-linux-headless".activationPackage -L
          elif [[ "${{ matrix.os }}" == "macos-15" ]]; then
            echo "Building for macOS (siraben@aarch64-darwin-full)"
            nix build .#homeConfigurations."siraben@aarch64-darwin-full".activationPackage -L
          else
            echo "::error::Unsupported OS: ${{ matrix.os }}"
            exit 1
          fi
