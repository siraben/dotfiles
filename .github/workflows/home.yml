name: Build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: home-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            configuration: siraben@x86_64-linux-headless
          - os: macos-15
            configuration: siraben@aarch64-darwin-full
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Nix with Flakes support
        uses: cachix/install-nix-action@v31.3.0

      - name: Configure Cachix for pull requests
        if: github.event_name == 'pull_request'
        uses: cachix/cachix-action@v16
        with:
          name: siraben

      - name: Configure Cachix for trusted pushes
        if: github.event_name == 'push'
        uses: cachix/cachix-action@v16
        with:
          name: siraben
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Home Manager configuration
        run: nix build '.#homeConfigurations."${{ matrix.configuration }}".activationPackage' -L
